# AttentionUNet vessel segmentation — all hyperparameters live here

# ── W&B logging ───────────────────────────────────────────────────────────────
wandb_entity:  "eeebashit"
wandb_project: "vessel-seg"

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── Cross-validation ──────────────────────────────────────────────────────────
n_folds:    5
test_split: 0.2
folds:      5
patience:   20

# ── Training ──────────────────────────────────────────────────────────────────
epochs:      100
batch_size:  12
lr:          0.0001
num_workers: 8

# ── Loss weights (VesselLoss) ─────────────────────────────────────────────────
lambda_tversky: 1.0
lambda_cldice:  0.0   # disabled — enable for topology-aware training
tversky_beta:   0.5   # 0.5 = Dice; 0.7 = FN penalised 2.3× more than FP

# ── Hanning gate ──────────────────────────────────────────────────────────────
plain_hann: false

# ── Blur augmentation ─────────────────────────────────────────────────────────
blur_prob:      0.3
blur_sigma_max: 4.0
