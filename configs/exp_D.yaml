# Experiment D: plain Hanning + aggressive blur augmentation (B + C combined)
# Goal: maximum blur-region learning — removes sharpness gate AND uses strong blur aug
# If D outperforms B and C individually, the two fixes are complementary not redundant

# ── W&B logging (train.py → wandb.init) ───────────────────────────────────────
wandb_entity:  "eeebashit"
wandb_project: "vessel-seg"

# ── Reproducibility (train.py → set_seed) ─────────────────────────────────────
seed: 42

# ── Cross-validation (train.py → KFold, train_test_split) ────────────────────
n_folds:    5
test_split: 0.2
folds:      1
patience:   30

# ── Training loop (train.py → DataLoader, AdamW, scheduler) ──────────────────
epochs:      200
batch_size:  8
lr:          0.0001
num_workers: 8

# ── Loss weights (train.py → loss.py VesselLoss) ─────────────────────────────
lambda_cldice:   1.0
lambda_boundary: 0.5
lambda_contrast: 0.1
lambda_coarse:   0.4         # inactive — graph path disabled
hard_neg_factor: 2.0

# ── Model architecture (model.py → VesselSegNet → SAM2Encoder) ───────────────
sam2_model: "facebook/sam2.1-hiera-tiny"

# ── Loss weighting gate (train.py → VesselDataset(sharp_hann = not plain_hann)) ─
plain_hann: true             # true → plain Hanning; model trains on blurry regions (from exp_B)

# ── Blur augmentation (train.py → VesselDataset → dataset.py _augment()) ──────
blur_prob:      0.6          # 60% blur prob (from exp_C)
blur_sigma_max: 8.0          # strong blur sigma (from exp_C)
