# Experiment B: plain Hanning — forces model to learn blurry regions
# Goal: remove sharpness gate from loss so model gets gradient from blurry pixels too
# Differs from A: plain_hann: true

# ── W&B logging (train.py → wandb.init) ───────────────────────────────────────
wandb_entity:  "eeebashit"
wandb_project: "vessel-seg"

# ── Reproducibility (train.py → set_seed) ─────────────────────────────────────
seed: 42

# ── Cross-validation (train.py → KFold, train_test_split) ────────────────────
n_folds:    5
test_split: 0.2
folds:      1
patience:   30

# ── Training loop (train.py → DataLoader, AdamW, scheduler) ──────────────────
epochs:      200
batch_size:  8
lr:          0.0001
num_workers: 8

# ── Loss weights (train.py → loss.py VesselLoss) ─────────────────────────────
lambda_cldice:   1.0
lambda_boundary: 0.5
lambda_contrast: 0.1
lambda_coarse:   0.4         # inactive — graph path disabled
hard_neg_factor: 2.0

# ── Model architecture (model.py → VesselSegNet → SAM2Encoder) ───────────────
sam2_model: "facebook/sam2.1-hiera-tiny"

# ── Loss weighting gate (train.py → VesselDataset(sharp_hann = not plain_hann)) ─
plain_hann: true             # true → sharp_hann=False: plain Hanning, no sharpness gate
sharp_gate: true             # true → multiply decoder features by sharpness map before head
use_focus_gate: false
lambda_focus: 0.5
                             #   model trains equally on blurry regions → detects blur-region vessels
                             #   (exp_A uses false = sharpness-gated Hanning)

# ── Blur augmentation (train.py → VesselDataset → dataset.py _augment()) ──────
blur_prob:      0.3          # same as exp_A — isolates the plain_hann effect
blur_sigma_max: 4.0
sam2_local_dir: "sam2_weights"  # relative to project root; pre-downloaded by scripts/download_sam2.sh
