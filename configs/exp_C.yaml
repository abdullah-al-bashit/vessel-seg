# Experiment C: aggressive blur augmentation
# Goal: expose model to stronger and more frequent blur → more robust to out-of-focus regions
# Differs from A: blur_prob: 0.6, blur_sigma_max: 8.0

# ── W&B logging (train.py → wandb.init) ───────────────────────────────────────
wandb_entity:  "eeebashit"
wandb_project: "vessel-seg"

# ── Reproducibility (train.py → set_seed) ─────────────────────────────────────
seed: 42

# ── Cross-validation (train.py → KFold, train_test_split) ────────────────────
n_folds:    5
test_split: 0.2
folds:      1
patience:   30

# ── Training loop (train.py → DataLoader, AdamW, scheduler) ──────────────────
epochs:      200
batch_size:  8
lr:          0.0001
num_workers: 8

# ── Loss weights (train.py → loss.py VesselLoss) ─────────────────────────────
lambda_cldice:   1.0
lambda_boundary: 0.5
lambda_contrast: 0.1
lambda_coarse:   0.4         # inactive — graph path disabled
hard_neg_factor: 2.0

# ── Model architecture (model.py → VesselSegNet → SAM2Encoder) ───────────────
sam2_model: "facebook/sam2.1-hiera-tiny"

# ── Loss weighting gate (train.py → VesselDataset(sharp_hann = not plain_hann)) ─
plain_hann: false            # same as exp_A — isolates the blur aug effect
sharp_gate: false
use_focus_gate: true         # true → learned focus head gates decoder features
lambda_focus: 0.5

# ── Blur augmentation (train.py → VesselDataset → dataset.py _augment()) ──────
blur_prob:      0.6          # 60% of tiles get blur aug (vs 30% in exp_A/B)
                             # dataset.py _augment(): if rng.random() < blur_prob → gaussian_filter
blur_sigma_max: 8.0          # twice as strong as exp_A — sigma ~ Uniform(1.5, 8.0)
                             # dataset.py _augment(): sigma ~ Uniform(1.5, blur_sigma_max)
